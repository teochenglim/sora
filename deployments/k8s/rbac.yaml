apiVersion: v1
kind: ServiceAccount
metadata:
  name: sora
  labels:
    app: sora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sora
  labels:
    app: sora
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sora
  labels:
    app: sora
subjects:
  - kind: ServiceAccount
    name: sora
roleRef:
  kind: Role
  name: sora
  apiGroup: rbac.authorization.k8s.io
