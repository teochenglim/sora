# Template only — fill in real values out-of-band (sealed-secrets, External
# Secrets Operator, `kubectl create secret`, etc.) and never commit a real
# copy of this file with secrets populated.
apiVersion: v1
kind: Secret
metadata:
  name: sora-secrets
  labels:
    app: sora
type: Opaque
stringData:
  AI_API_KEY: "${AI_API_KEY}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
  SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET}"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
  TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
  PAGERDUTY_KEY: "${PAGERDUTY_KEY}"
