apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sora.fullname" . }}
  labels:
    {{- include "sora.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sora.fullname" . }}
  labels:
    {{- include "sora.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sora.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "sora.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
