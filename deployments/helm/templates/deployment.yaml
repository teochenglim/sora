apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sora.fullname" . }}
  labels:
    {{- include "sora.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sora.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sora.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sora.serviceAccountName" . }}
      containers:
        - name: sora
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--mode={{ .Values.mode }}", "--config=/etc/sora/config.yaml"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ include "sora.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/sora/config.yaml
              subPath: config.yaml
            - name: rules
              mountPath: /etc/sora/rules.yaml
              subPath: rules.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "sora.fullname" . }}-config
        - name: rules
          configMap:
            name: {{ include "sora.fullname" . }}-rules
