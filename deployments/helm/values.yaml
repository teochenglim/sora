image:
  repository: ghcr.io/teochenglim/sora
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

mode: full # classifier | remediation | full | notify-only | demo

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  # Inline YAML merged verbatim into the sora-config ConfigMap; see
  # configs/config.yaml in the repo for the full annotated reference.
  inline: |
    server:
      port: 8080
    mode: full
    ai:
      provider: anthropic
      model: claude-3-5-sonnet-20241022

rules:
  inline: |
    classifier_rules: []
    remediation_rules: []

secrets:
  # Set these (or reference an existing Secret via existingSecret) for
  # non-demo deployments.
  existingSecret: ""
  aiApiKey: ""
  redisPassword: ""
  slackWebhookURL: ""
  slackSigningSecret: ""
  telegramBotToken: ""
  telegramChatID: ""
  pagerdutyKey: ""

serviceAccount:
  create: true
  name: ""
